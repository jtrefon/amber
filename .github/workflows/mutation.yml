name: Mutation (advisory)

# Mutation testing asks whether the tests would notice a changed line, which
# coverage cannot answer. It is advisory on purpose: Mull runs the test program
# once per mutant, and without per-test coverage that program is the whole unit
# suite. The score also depends on which tests ran, so a threshold is not a gate
# yet. See docs/plan/mutation-testing-spike.md for the measurement and the
# decision.
#
# Nightly, against the last 24 hours of `main`; dispatch it with another base to
# analyse a branch. It is not part of ci.yml and cannot block a pull request.
on:
  schedule:
    - cron: '17 4 * * *'
  workflow_dispatch:
    inputs:
      base:
        description: Base ref to diff against
        required: false
        default: origin/main

permissions:
  contents: read

concurrency:
  group: mutation-${{ github.ref }}
  cancel-in-progress: false

jobs:
  mutation:
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 0

      - uses: ./.github/actions/install-deps
        with:
          # The Mull package names its LLVM dependencies explicitly. `clang` is
          # 18 on the 24.04 runner, matching mull-18 / LLVM 18.1.3.
          extra: libclang-cpp18 libllvm18

      - name: Install Mull (pinned)
        run: |
          version=0.38.0
          base="https://github.com/mull-project/mull/releases/download/${version}"
          curl -fsSL -o /tmp/mull.deb \
            "$base/Mull-${version}-ubuntu-amd64-24.04.deb"
          curl -fsSL -o /tmp/mull-18.deb \
            "$base/Mull-18-${version}-LLVM-18.1.3-ubuntu-amd64-24.04.deb"
          echo "83ebc3c49f173b83dc0d991fff4b3ac8d6a2a7ecf51244d598507f85b04d5a29  /tmp/mull.deb" \
            | sha256sum -c -
          echo "8b3840841fc1cea78844ae35a1d48c0a0db3b0ce435019cd50ef78dd578b61bb  /tmp/mull-18.deb" \
            | sha256sum -c -
          sudo dpkg -i /tmp/mull.deb /tmp/mull-18.deb ||
            sudo apt-get -f install -y
          mull-runner-18 --version

      - name: Choose the diff base
        id: base
        run: |
          if [ -n "${{ inputs.base }}" ]; then
            base="${{ inputs.base }}"
          else
            base="$(git rev-list -1 --before='24 hours ago' HEAD)"
            [ -n "$base" ] || base="origin/main"
          fi
          echo "base=$base" >> "$GITHUB_OUTPUT"
          echo "Mutation base: \`$base\` ($(git rev-parse --short "$base"))" \
            >> "$GITHUB_STEP_SUMMARY"

      - name: Mutation run (advisory)
        env:
          CXX: clang++
          MULL_RUNNER: mull-runner-18
          MULL_FRONTEND: /usr/lib/mull-ir-frontend-18
          MUTATION_BASE: ${{ steps.base.outputs.base }}
          MUTATION_REPORT: ${{ runner.temp }}/mutation.sqlite
          MUTATION_MARKDOWN: ${{ runner.temp }}/mutation.md
        run: sh tools/mutation_check.sh

      - name: Publish the summary
        if: always()
        run: cat "$RUNNER_TEMP/mutation.md" >> "$GITHUB_STEP_SUMMARY" 2>/dev/null || true

      - name: Upload the report
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: mutation-report
          path: |
            ${{ runner.temp }}/mutation.sqlite
            ${{ runner.temp }}/mutation.md
          if-no-files-found: warn
          retention-days: 14
