name: CI

on:
  push:
    branches: [master, main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

# Cancel superseded PR runs so a force-push does not leave stale jobs burning
# compute. Pushes to main are never cancelled (each must complete).
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  # ---------------------------------------------------------------------------
  # Change detection — gates every heavyweight job on which parts of the tree
  # a PR touched. Docs-only PRs skip the whole C++ suite; C++-only PRs skip
  # the website build. Skipped jobs report success, so required checks still
  # pass. Non-PR events (main pushes, dispatch) run everything.
  # ---------------------------------------------------------------------------
  changes:
    runs-on: ubuntu-latest
    outputs:
      cpp: ${{ steps.filter.outputs.cpp }}
      website: ${{ steps.filter.outputs.website }}
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - id: filter
        run: |
          if [ "${{ github.event_name }}" != "pull_request" ]; then
            echo "cpp=true" >> "$GITHUB_OUTPUT"
            echo "website=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          files="$(git diff --name-only origin/${{ github.base_ref }}...HEAD)"
          cpp=false; web=false
          echo "$files" | grep -qE '^(lib|src|tui|bench|tools|plugins|include|tests|examples|prompts)/|^(Makefile\.in|GNUmakefile|configure|\.clang-format|\.clang-tidy|cppcheck_suppressions\.txt|version\.txt|completions\.json|amber\.conf)$|^\.github/' && cpp=true || true
          echo "$files" | grep -q '^website/' && web=true || true
          # This workflow's own definition affects both halves.
          echo "$files" | grep -q '^\.github/workflows/ci\.yml$' && { cpp=true; web=true; } || true
          echo "cpp=$cpp" >> "$GITHUB_OUTPUT"
          echo "website=$web" >> "$GITHUB_OUTPUT"

  # ---------------------------------------------------------------------------
  # Static analysis — clang-tidy (per-file). On PRs, runs incrementally: only
  # the .cpp files changed in the PR are analyzed (headers/.clang-tidy changes
  # trigger a full scan as fallback). On main pushes, the full lint runs as a
  # non-gating safety net (see lint-full below).
  # ---------------------------------------------------------------------------
  lint:
    needs: [changes]
    runs-on: ubuntu-latest
    if: github.event_name == 'pull_request' && needs.changes.outputs.cpp == 'true'
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: ./.github/actions/install-deps
        with:
          extra: clang-tidy

      - name: Configure (generates config for include paths)
        run: CXX=clang++ ./configure

      - name: Lint (incremental — changed files only)
        run: make lint-changed BASE=origin/${{ github.base_ref }}

  # ---------------------------------------------------------------------------
  # Full lint — runs on main pushes as a non-gating safety net. Catches issues
  # that incremental lint might miss (e.g. a header change that affects TUs not
  # included in the PR diff). Does not block the pipeline.
  # ---------------------------------------------------------------------------
  lint-full:
    needs: [changes]
    runs-on: ubuntu-latest
    if: (github.ref == 'refs/heads/main' || github.ref == 'refs/heads/master') && needs.changes.outputs.cpp == 'true'
    continue-on-error: true
    steps:
      - uses: actions/checkout@v7
      - uses: ./.github/actions/install-deps
        with:
          extra: clang-tidy

      - name: Configure
        run: CXX=clang++ ./configure

      - name: Lint (full tree)
        run: make lint

  # ---------------------------------------------------------------------------
  # Static analysis — cppcheck (cross-TU, compiler-agnostic). Independent of
  # the compiler matrix; runs once. Includes unusedFunction detection.
  # ---------------------------------------------------------------------------
  analyze:
    needs: [changes]
    runs-on: ubuntu-latest
    if: needs.changes.outputs.cpp == 'true'
    steps:
      - uses: actions/checkout@v7
      - uses: ./.github/actions/install-deps
        with:
          extra: cppcheck

      - name: Configure
        run: ./configure

      - name: Static analysis (cppcheck)
        run: make analyze

  # ---------------------------------------------------------------------------
  # Build hygiene — smoketest + static invariant checks (P1–P5).
  # Catches stale build rules, missing .d generation, and audit-table drift.
  # ---------------------------------------------------------------------------
  check:
    needs: [changes]
    runs-on: ubuntu-latest
    if: needs.changes.outputs.cpp == 'true'
    steps:
      - uses: actions/checkout@v7
      - uses: ./.github/actions/install-deps

      - name: Configure
        run: ./configure

      - name: Check (smoketest + build hygiene)
        run: make check

  # ---------------------------------------------------------------------------
  # Duplicate code — cross-file duplicate block detector. Gating: identical
  # normalized blocks of >=6 lines fail the job.
  # ---------------------------------------------------------------------------
  duplicates:
    needs: [changes]
    runs-on: ubuntu-latest
    if: needs.changes.outputs.cpp == 'true'
    steps:
      - uses: actions/checkout@v7

      - name: Configure
        run: ./configure

      - name: Duplicate detection
        run: make duplicates

  # ---------------------------------------------------------------------------
  # Complexity — informational, no fail (CCN>15 or length>50 via lizard).
  # Keeps tech debt visible without blocking; tighten to CCN 10 later.
  # ---------------------------------------------------------------------------
  complexity:
    needs: [changes]
    runs-on: ubuntu-latest
    if: needs.changes.outputs.cpp == 'true'
    steps:
      - uses: actions/checkout@v7
      - uses: ./.github/actions/install-deps
      - name: Install lizard
        run: pip install lizard -q
      - name: Complexity (lizard)
        run: make complexity

  # ---------------------------------------------------------------------------
  # Format — clang-format dry-run. Gating on PRs (changed files only, so
  # enforcement ratchets in without reformatting the pre-existing tree);
  # informational full-tree sweep on main pushes. Note: apt's clang-format
  # version can disagree with a contributor's local version — if a PR fails
  # here, match the runner's version before reformatting.
  # ---------------------------------------------------------------------------
  format-check:
    needs: [changes]
    runs-on: ubuntu-latest
    if: needs.changes.outputs.cpp == 'true'
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: ./.github/actions/install-deps
        with:
          extra: clang-format

      - name: Configure
        run: ./configure

      - name: Format check (changed files — gating)
        if: github.event_name == 'pull_request'
        run: make format-check-changed BASE=origin/${{ github.base_ref }}

      - name: Format check (full tree — informational)
        if: github.event_name != 'pull_request'
        run: make format-check

  # ---------------------------------------------------------------------------
  # Sanitizers — full build + test suite under ASan+UBSan (clang). Catches
  # memory errors and UB that the plain build cannot surface.
  # ---------------------------------------------------------------------------
  sanitizers:
    needs: [changes]
    runs-on: ubuntu-latest
    if: needs.changes.outputs.cpp == 'true'
    steps:
      - uses: actions/checkout@v7
      - uses: ./.github/actions/install-deps

      - name: Configure (ASan + UBSan)
        run: |
          CXX=clang++ \
          CXXFLAGS="-O1 -g -fsanitize=address,undefined -fno-omit-frame-pointer -std=c++17" \
          CFLAGS="-O1 -g -fsanitize=address,undefined -fno-omit-frame-pointer -std=c99" \
          ./configure

      - name: Build
        run: make -j$(nproc)

      - name: Test (ASan + UBSan)
        env:
          ASAN_OPTIONS: detect_leaks=1
          UBSAN_OPTIONS: print_stacktrace=1:halt_on_error=1
        run: make test

  # ---------------------------------------------------------------------------
  # Coverage — gcov build + test run, Cobertura XML uploaded to Codecov.
  # Requires the CODECOV_TOKEN repository secret; until it is set the upload
  # is best-effort (fail_ci_if_error: false) so the job stays green.
  # ---------------------------------------------------------------------------
  coverage:
    needs: [changes]
    runs-on: ubuntu-latest
    if: needs.changes.outputs.cpp == 'true'
    steps:
      - uses: actions/checkout@v7
      - uses: ./.github/actions/install-deps

      - name: Install gcovr
        run: pip install gcovr -q

      - name: Configure (gcov instrumentation)
        run: |
          CXX=g++ \
          CXXFLAGS="-O0 -g --coverage -std=c++17" \
          CFLAGS="-O0 -g --coverage -std=c99" \
          ./configure

      - name: Build
        run: make -j$(nproc)

      - name: Test
        run: make test

      - name: Generate coverage report
        run: |
          gcovr --root . \
            --filter 'lib/.*' --filter 'tools/.*' --filter 'tui/.*' \
            --filter 'src/.*' --filter 'bench/.*' --filter 'plugins/.*' \
            --exclude '.*tests/.*' --exclude '.*third_party/.*' \
            --xml-pretty -o coverage.xml

      - name: Upload to Codecov
        uses: codecov/codecov-action@v5
        with:
          files: coverage.xml
          token: ${{ secrets.CODECOV_TOKEN }}
          fail_ci_if_error: false

  # ---------------------------------------------------------------------------
  # Build + unit test — runs under both g++ and clang++ so ABI/syntax
  # differences are caught at PR time. Runs in parallel with the static
  # analysis jobs (public-repo compute is free; wall-clock feedback wins).
  # ---------------------------------------------------------------------------
  build-and-test:
    needs: [changes]
    if: needs.changes.outputs.cpp == 'true'
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        cxx: [g++, clang++]
    env:
      CXX: ccache ${{ matrix.cxx }}
    steps:
      - uses: actions/checkout@v7
      - uses: ./.github/actions/install-deps
        with:
          extra: ccache

      - name: Cache ccache
        uses: actions/cache@v4
        with:
          path: ~/.ccache
          key: ccache-${{ matrix.cxx }}-${{ hashFiles('**/*.cpp', '**/*.h', 'Makefile.in', 'configure') }}
          restore-keys: ccache-${{ matrix.cxx }}-

      - name: Configure
        run: ./configure

      - name: Build
        run: make

      - name: Test
        run: make test

  # ---------------------------------------------------------------------------
  # macOS build-and-test — verifies the portable link lines (no --start-group)
  # and that the core compiles + tests pass on Apple's toolchain.
  # ---------------------------------------------------------------------------
  build-and-test-macos:
    needs: [changes]
    if: needs.changes.outputs.cpp == 'true'
    runs-on: macos-latest
    env:
      CXX: ccache clang++
    steps:
      - uses: actions/checkout@v7
      - uses: ./.github/actions/install-deps

      - name: Cache ccache
        uses: actions/cache@v4
        with:
          path: ~/Library/Caches/ccache
          key: ccache-macos-${{ hashFiles('**/*.cpp', '**/*.h', 'Makefile.in', 'configure') }}
          restore-keys: ccache-macos-

      - name: Configure
        # brew's ncurses is keg-only, so pkg-config cannot see its .pc files
        # without PKG_CONFIG_PATH pointing at the brew prefix. Without the wide
        # ncursesw the TUI's UTF-8 wide-char calls (mvaddnwstr/mvaddwstr) fail
        # to compile on macOS.
        run: |
          export PKG_CONFIG_PATH="$(brew --prefix ncurses)/lib/pkgconfig${PKG_CONFIG_PATH:+:$PKG_CONFIG_PATH}"
          ./configure

      - name: Build
        run: make

      - name: Test
        run: make test

  # ---------------------------------------------------------------------------
  # CD — build release artifacts on every push to main (not just tags), so the
  # latest main is always shippable. Artifacts are stored for 7 days.
  # ---------------------------------------------------------------------------
  cd:
    if: github.ref == 'refs/heads/main' || github.ref == 'refs/heads/master'
    needs: [changes, build-and-test]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: ./.github/actions/install-deps
        with:
          extra: ruby ruby-dev
      - name: Install fpm
        run: sudo gem install --no-document fpm

      - name: Configure
        run: ./configure --prefix=/usr

      - name: Build
        run: make

      - name: Stage install tree
        run: |
          rm -rf stage
          make install DESTDIR="$PWD/stage"

      - name: Build tarball + checksum
        run: |
          version="$(cat version.txt)-main"
          name="amber-${version}-linux-x86_64"
          mkdir -p dist
          tar -C stage -czf "dist/${name}.tar.gz" .
          ( cd dist && sha256sum "${name}.tar.gz" > "${name}.tar.gz.sha256" )

      - name: Build .deb (fpm)
        run: |
          version="$(cat version.txt)-main"
          fpm -s dir -t deb \
            -n amber \
            -v "${version}" \
            --license "Apache-2.0" \
            --maintainer "Jacek Trefon <hello@trefon.com>" \
            --url "https://github.com/jtrefon/amber" \
            --description "C++ AI agent harness with a headless CLI and ncurses TUI." \
            --depends "libcurl4" \
            --depends "libncursesw6" \
            --deb-no-default-config-files \
            -C stage \
            -p "dist/amber_${version}_amd64.deb" \
            usr
          ( cd dist && sha256sum "amber_${version}_amd64.deb" > "amber_${version}_amd64.deb.sha256" )

      - name: Upload tarball
        uses: actions/upload-artifact@v7
        with:
          name: amber-linux-tarball
          path: dist/*.tar.gz*
          retention-days: 7

      - name: Upload .deb
        uses: actions/upload-artifact@v7
        with:
          name: amber-linux-deb
          path: dist/*.deb*
          retention-days: 7

  # ---------------------------------------------------------------------------
  # CD (macOS) — build the macOS release artifact on every push to main so the
  # latest main is always shippable on Apple silicon. Produces a
  # self-contained tarball (binaries + data) for the Homebrew tap.
  # ---------------------------------------------------------------------------
  cd-macos:
    if: github.ref == 'refs/heads/main' || github.ref == 'refs/heads/master'
    needs: [changes, build-and-test-macos]
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v7
      - uses: ./.github/actions/install-deps

      - name: Configure
        # brew's ncurses is keg-only; point pkg-config at it so the wide
        # ncursesw (required for the TUI's UTF-8 wide-char rendering) is found.
        run: |
          export PKG_CONFIG_PATH="$(brew --prefix ncurses)/lib/pkgconfig${PKG_CONFIG_PATH:+:$PKG_CONFIG_PATH}"
          ./configure --prefix=/usr/local

      - name: Build
        run: make

      - name: Stage install tree
        run: |
          rm -rf stage
          make install DESTDIR="$PWD/stage"

      - name: Build tarball + checksum
        run: |
          version="$(cat version.txt)-main"
          arch="$(uname -m)"
          name="amber-${version}-darwin-${arch}"
          mkdir -p dist
          tar -C stage -czf "dist/${name}.tar.gz" .
          ( cd dist && shasum -a 256 "${name}.tar.gz" > "${name}.tar.gz.sha256" )

      - name: Upload tarball
        uses: actions/upload-artifact@v7
        with:
          name: amber-macos-tarball
          path: dist/*.tar.gz*
          retention-days: 7

  # ---------------------------------------------------------------------------
  # Website build — validates the Astro site builds cleanly. Runs only when
  # website/ (or this workflow) changed.
  # ---------------------------------------------------------------------------
  website-build:
    needs: [changes]
    if: needs.changes.outputs.website == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: website/package-lock.json

      - name: Install dependencies
        run: cd website && npm ci

      - name: Build
        run: cd website && npm run build

      - name: Upload dist artifact (for deploy)
        if: github.ref == 'refs/heads/main' || github.ref == 'refs/heads/master'
        uses: actions/upload-pages-artifact@v5
        with:
          path: website/dist

  # ---------------------------------------------------------------------------
  # Website deploy — pushes the built site to GitHub Pages on main.
  # ---------------------------------------------------------------------------
  website-deploy:
    if: github.ref == 'refs/heads/main' || github.ref == 'refs/heads/master'
    needs: [website-build]
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    permissions:
      pages: write
      id-token: write
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5
