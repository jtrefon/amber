name: CI

on:
  push:
    branches: [master, main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

# Cancel superseded PR runs so a force-push does not leave stale jobs burning
# compute. Pushes to main are never cancelled (each must complete).
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  # ---------------------------------------------------------------------------
  # Change detection — gates every heavyweight job on which parts of the tree
  # a PR touched. Docs-only PRs skip the whole C++ suite; C++-only PRs skip
  # the website build. Skipped jobs report success, so required checks still
  # pass. Non-PR events (main pushes, dispatch) run everything.
  # ---------------------------------------------------------------------------
  changes:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    outputs:
      cpp: ${{ steps.filter.outputs.cpp }}
      website: ${{ steps.filter.outputs.website }}
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - id: filter
        run: |
          if [ "${{ github.event_name }}" != "pull_request" ]; then
            echo "cpp=true" >> "$GITHUB_OUTPUT"
            echo "website=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          files="$(git diff --name-only origin/${{ github.base_ref }}...HEAD)"
          cpp=false; web=false
          echo "$files" | grep -qE '^(lib|src|tui|bench|tools|plugins|include|tests|examples|prompts)/|^(Makefile\.in|GNUmakefile|configure|\.clang-format|\.clang-tidy|cppcheck_suppressions\.txt|version\.txt|completions\.json|amber\.conf)$|^\.github/' && cpp=true || true
          echo "$files" | grep -q '^website/' && web=true || true
          # This workflow's own definition affects both halves.
          echo "$files" | grep -q '^\.github/workflows/ci\.yml$' && { cpp=true; web=true; } || true
          echo "cpp=$cpp" >> "$GITHUB_OUTPUT"
          echo "website=$web" >> "$GITHUB_OUTPUT"

  # ---------------------------------------------------------------------------
  # Dependency review — inspect manifest and lockfile changes on pull requests.
  # ---------------------------------------------------------------------------
  dependency-review:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
      pull-requests: read
    steps:
      - uses: actions/checkout@v7
      - name: Review dependency changes
        uses: actions/dependency-review-action@v5
        with:
          fail-on-severity: high

  # ---------------------------------------------------------------------------
  # Static analysis — clang-tidy (per-file). On PRs, runs incrementally over the
  # TUs the diff can affect: the changed .cpp files plus every TU whose includes
  # reach a changed header, resolved from the compiler's own dependency scan
  # (-MM) by tools/affected_tus.py. A .clang-tidy change still lints everything,
  # since it changes how every TU is checked. On main pushes the full lint runs
  # as a non-gating safety net (see lint-full below).
  # ---------------------------------------------------------------------------
  # ---------------------------------------------------------------------------
  # Lint — clang-tidy. PR-gating, incremental over the TUs a change can affect.
  #
  # clang-tidy is PINNED, and .clang-tidy enables whole check families
  # (bugprone-*, readability-*, modernize-*, clang-analyzer-*), so every check a
  # new clang release adds is enabled automatically. The baseline is empty, so
  # such a release does not merely add findings -- it turns every PR red, with
  # no way to tell "we introduced a problem" from "the tool got stricter".
  # Measured drift between 18 and 23 is real, not theoretical: on the same tree
  # clang-tidy 23 reports bugprone-command-processor, readability-trailing-comma,
  # readability-redundant-nested-if and readability-redundant-qualified-alias,
  # none of which 18 reports. Keep CLANG_TIDY_MIN_VERSION in Makefile.in in step
  # with the pin here; that floor fails closed on an older analyzer.
  # ---------------------------------------------------------------------------
  lint:
    needs: [changes]
    runs-on: ubuntu-latest
    timeout-minutes: 45
    if: github.event_name == 'pull_request' && needs.changes.outputs.cpp == 'true'
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: ./.github/actions/install-deps
        with:
          extra: clang-tidy-18

      - name: Configure (generates config for include paths)
        run: CXX=clang++ ./configure

      - name: Lint (incremental — changed files only)
        run: make lint-changed BASE=origin/${{ github.base_ref }}
        env:
          CLANG_TIDY: clang-tidy-18

  # ---------------------------------------------------------------------------
  # Full lint — runs on main pushes as a non-gating safety net. Independent of
  # the incremental selector: if tools/affected_tus.py ever under-selects (a
  # dependency the compiler does not see, a wrong diff base), this still sees
  # the whole tree. Does not block the pipeline.
  # ---------------------------------------------------------------------------
  lint-full:
    needs: [changes]
    runs-on: ubuntu-latest
    timeout-minutes: 60
    if: (github.ref == 'refs/heads/main' || github.ref == 'refs/heads/master') && needs.changes.outputs.cpp == 'true'
    continue-on-error: true
    steps:
      - uses: actions/checkout@v7
      - uses: ./.github/actions/install-deps
        with:
          extra: clang-tidy-18

      - name: Configure
        run: CXX=clang++ ./configure

      - name: Lint (full tree)
        run: make lint
        env:
          CLANG_TIDY: clang-tidy-18

  # ---------------------------------------------------------------------------
  # Static analysis — cppcheck (cross-TU, compiler-agnostic). Independent of
  # the compiler matrix; runs once. Includes unusedFunction detection.
  #
  # cppcheck is pinned deliberately: the distro package is older than the checks
  # the gate relies on (uninitMemberVarNoCtor and friends arrived in 2.21), so
  # apt would quietly analyze less than a developer's toolchain and pass. Keep
  # this in step with CPPCHECK_MIN_VERSION in Makefile.in, which fails closed
  # below it.
  # ---------------------------------------------------------------------------
  analyze:
    needs: [changes]
    runs-on: ubuntu-latest
    timeout-minutes: 60
    if: needs.changes.outputs.cpp == 'true'
    steps:
      - uses: actions/checkout@v7
      - uses: ./.github/actions/install-deps

      - uses: mamba-org/setup-micromamba@v3
        with:
          environment-name: cppcheck
          create-args: cppcheck=2.22.0
          cache-environment: true

      # cppcheck re-analyzes only files whose hash changed, so a warm build dir
      # takes the job from ~25 min to a couple of minutes. restore-keys falls
      # back to the newest cache when sources changed, which is the point.
      - name: Cache cppcheck analysis
        uses: actions/cache@v6
        with:
          path: /tmp/cppcheck_amber
          key: cppcheck-2.22.0-${{ hashFiles('**/*.cpp', '**/*.h', 'cppcheck_suppressions.txt') }}
          restore-keys: cppcheck-2.22.0-

      - name: Configure
        run: ./configure

      - name: Static analysis (cppcheck)
        run: make analyze
        shell: micromamba-shell {0}

  # ---------------------------------------------------------------------------
  # Build hygiene — smoketest + static invariant checks (P1–P5), plus the
  # class-size, nesting and debt gates and the gate tools' own unit tests. It
  # needs lizard now (the nesting gate), pinned as in the complexity job.
  # ---------------------------------------------------------------------------
  check:
    needs: [changes]
    runs-on: ubuntu-latest
    timeout-minutes: 30
    if: needs.changes.outputs.cpp == 'true'
    steps:
      - uses: actions/checkout@v7
      - uses: ./.github/actions/install-deps

      # `make check` runs the nesting gate, which parses lizard's -w output. Pinned
      # for the same reason as the complexity job, and floored by the Makefile.
      - name: Install lizard
        run: pip install "lizard==1.24.0" -q

      - name: Configure
        run: ./configure

      - name: Check (smoketest + build hygiene)
        run: make check

      # The gate report is the reviewable artefact: one table with every gate's
      # verdict, downloadable from the run page or with `gh run download`.
      - name: Upload gate report (artefact)
        uses: actions/upload-artifact@v7
        with:
          name: gate-report
          path: artifacts/
          if-no-files-found: error
          retention-days: 30

  # ---------------------------------------------------------------------------
  # Duplicate code — cross-file duplicate block detector. Gating: identical
  # normalized blocks of >=6 lines fail the job.
  # ---------------------------------------------------------------------------
  duplicates:
    needs: [changes]
    runs-on: ubuntu-latest
    timeout-minutes: 15
    if: needs.changes.outputs.cpp == 'true'
    steps:
      - uses: actions/checkout@v7

      - name: Duplicate detection
        # No configure/install-deps needed: the detector is pure python3.
        run: python3 tools/duplicate_detector.py --min-lines=6 lib tools tui tests src

  # ---------------------------------------------------------------------------
  # Obfuscated-payload guard. Deliberately has NO `if:` — it runs on every PR,
  # including docs- and website-only ones. An obfuscated JavaScript dropper sat
  # in website/ for months (commit f382c38) because every other gate reads a
  # build or a metric and none of them reads file contents. Scans tracked files
  # only, so it needs no toolchain and finishes in about a second.
  # ---------------------------------------------------------------------------
  obfuscation-guard:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v7
      - name: Scan tracked files for obfuscated payloads
        run: python3 tools/obfuscation_guard.py

  # ---------------------------------------------------------------------------
  # Complexity — the gate (CCN>15 or NLOC>40 via lizard). Fails closed on a
  # regression, and is IN ci-gate: all three axes (CCN, cognitive complexity,
  # NLOC) have empty baselines, so there is no per-file baseline to conflict on
  # across merges — which is why it used to be advisory. Runs on the slim
  # dependency set: the gate itself is pure Python, install-deps is there only
  # for the compiler ./configure's probes need.
  # ---------------------------------------------------------------------------
  complexity:
    needs: [changes]
    runs-on: ubuntu-latest
    timeout-minutes: 20
    if: needs.changes.outputs.cpp == 'true'
    steps:
      - uses: actions/checkout@v7
      - uses: ./.github/actions/install-deps
        with:
          cpp_toolchain: 'false'
      # Pinned, and floored again by the `complexity` target. The gate parses
      # lizard's -w output with a regex and its NLOC/CCN arithmetic has moved
      # between releases; an unpinned lizard silently changes what the baseline
      # means. (Same reasoning as the cppcheck pin in the analyze job.)
      - name: Install lizard
        run: pip install "lizard==1.24.0" -q
      - name: Complexity (lizard)
        run: make complexity

  # ---------------------------------------------------------------------------
  # Format — clang-format dry-run. Gating on PRs (changed files only, so
  # enforcement ratchets in without reformatting the pre-existing tree);
  # informational full-tree sweep on main pushes. Note: apt's clang-format
  # version can disagree with a contributor's local version — if a PR fails
  # here, match the runner's version before reformatting.
  # ---------------------------------------------------------------------------
  format-check:
    needs: [changes]
    runs-on: ubuntu-latest
    timeout-minutes: 30
    if: needs.changes.outputs.cpp == 'true'
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: ./.github/actions/install-deps
        with:
          extra: clang-format

      - name: Configure
        run: ./configure

      - name: Format check (changed files — gating)
        if: github.event_name == 'pull_request'
        run: make format-check-changed BASE=origin/${{ github.base_ref }}

      - name: Format check (full tree — informational)
        if: github.event_name != 'pull_request'
        run: make format-check

  # ---------------------------------------------------------------------------
  # Sanitizers — full build + test suite under ASan+UBSan (clang). Catches
  # memory errors and UB that the plain build cannot surface.
  # ---------------------------------------------------------------------------
  sanitizers:
    needs: [changes]
    runs-on: ubuntu-latest
    timeout-minutes: 60
    if: needs.changes.outputs.cpp == 'true'
    steps:
      - uses: actions/checkout@v7
      - uses: ./.github/actions/install-deps

      - name: Configure (ASan + UBSan)
        run: |
          CXX=clang++ \
          CXXFLAGS="-O1 -g -fsanitize=address,undefined -fno-omit-frame-pointer -std=c++17" \
          CFLAGS="-O1 -g -fsanitize=address,undefined -fno-omit-frame-pointer -std=c99" \
          ./configure

      - name: Build
        run: make -j$(nproc)

      - name: Test (ASan + UBSan)
        env:
          ASAN_OPTIONS: detect_leaks=1
          UBSAN_OPTIONS: print_stacktrace=1:halt_on_error=1
        run: make test

  # ---------------------------------------------------------------------------
  # ThreadSanitizer — data-race detection. The UI thread, the per-window agent
  # workers, the tool-dispatch thread hop and the detached catalog/plugin workers
  # all share state; ASan+UBSan cannot see races, so three separate race fixes
  # (FIX-033, FIX-034, FIX-035) landed with no detector able to catch the class.
  # ---------------------------------------------------------------------------
  tsan:
    needs: [changes]
    runs-on: ubuntu-latest
    timeout-minutes: 60
    if: needs.changes.outputs.cpp == 'true'
    steps:
      - uses: actions/checkout@v7
      - uses: ./.github/actions/install-deps

      - name: Configure (TSan)
        run: |
          CXX=clang++ \
          CXXFLAGS="-O1 -g -fsanitize=thread -fno-omit-frame-pointer -std=c++17" \
          CFLAGS="-O1 -g -fsanitize=thread -fno-omit-frame-pointer -std=c99" \
          ./configure

      - name: Build
        run: make -j$(nproc)

      - name: Test (TSan)
        env:
          # Report every race instead of stopping at the first one: a green job
          # then means "no races at all", not "no race early".
          TSAN_OPTIONS: halt_on_error=0:second_deadlock_stack=1:history_size=7
        run: make test

  # ---------------------------------------------------------------------------
  # Coverage — gcov build + test run, Cobertura XML uploaded to Codecov.
  # Uploads via GitHub OIDC (use_oidc) so no CODECOV_TOKEN secret is needed
  # on this public repo. The upload is best-effort (fail_ci_if_error: false)
  # so the job stays green.
  # ---------------------------------------------------------------------------
  coverage:
    needs: [changes]
    runs-on: ubuntu-latest
    timeout-minutes: 60
    if: needs.changes.outputs.cpp == 'true'
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@v7
        with:
          # The patch-coverage gate diffs against the base commit, so the history
          # has to be present. Depth 0 is the reliable way to get it.
          fetch-depth: 0
      - uses: ./.github/actions/install-deps

      # Pinned for the same reason: gcovr's report layout feeds both this job's
      # own gates and .codecov.yml.
      - name: Install gcovr
        run: pip install "gcovr==8.6" -q

      - name: Configure (gcov instrumentation)
        run: |
          CXX=g++ \
          CXXFLAGS="-O0 -g --coverage -std=c++17" \
          CFLAGS="-O0 -g --coverage -std=c99" \
          ./configure

      - name: Build
        run: make -j$(nproc)

      - name: Test
        run: make test

      - name: Generate coverage report
        # conftest.gcno is left by configure's compile probes (built with the
        # coverage CXXFLAGS) and has no surviving source — remove it or gcovr
        # aborts on the orphan note file.
        #
        # Two runs: the 80% line gate covers the unit-testable core
        # (lib/tools/plugins), whose designated harness is the unit suite. The
        # UI (tui/), benchmark harness (bench/) and client entry points (src/)
        # are driven by the pty/e2e and bench harnesses, so they are reported to
        # Codecov but not gated — the documented bar is ">=80% line coverage for
        # new code paths" (PULL_REQUEST_TEMPLATE.md), not a whole-tree floor.
        run: |
          rm -rf conftest*
          gcovr --root . \
            --gcov-ignore-parse-errors=negative_hits.warn_once_per_file \
            --filter 'lib/.*' --filter 'tools/.*' --filter 'plugins/.*' \
            --exclude '.*tests/.*' --exclude '.*third_party/.*' \
            --fail-under-line 80 \
            --print-summary
          gcovr --root . \
            --gcov-ignore-parse-errors=negative_hits.warn_once_per_file \
            --filter 'lib/.*' --filter 'tools/.*' --filter 'tui/.*' \
            --filter 'src/.*' --filter 'bench/.*' --filter 'plugins/.*' \
            --exclude '.*tests/.*' --exclude '.*third_party/.*' \
            --exclude '.*src/main\.cpp' --exclude '.*src/smoketest\.cpp' \
            --exclude '.*bench/main\.cpp' --exclude '.*tui/tui_main\.cpp' \
            --xml-pretty -o coverage.xml

          # coverage.xml above is Cobertura, which carries the per-line hit
          # counts the patch gate needs. gcovr's --json-summary does NOT (its
          # entries have no `lines` key), which is why the gate reads XML.

      # Patch coverage: the documented "new code paths must have >=80% line
      # coverage". This was never actually enforced -- `.codecov.yml` asks for it,
      # but the Codecov upload below fails with "Repository not found" (the Codecov
      # GitHub App is not installed) behind fail_ci_if_error: false, so no Codecov
      # status check was ever created. Measured here instead.
      #
      # PATCH_COVERAGE_ENFORCE=false reports without blocking, for one PR if you
      # want to see the number before it starts biting.
      - name: Patch coverage gate
        env:
          PATCH_COVERAGE_ENFORCE: ${{ vars.PATCH_COVERAGE_ENFORCE != '' && vars.PATCH_COVERAGE_ENFORCE || 'true' }}
        run: |
          BASE="${{ github.event.pull_request.base.sha || github.event.before }}"
          if [ -z "$BASE" ] || [ "$BASE" = "0000000000000000000000000000000000000000" ]; then
            BASE="$(git rev-parse HEAD~1 2>/dev/null || echo '')"
          fi
          echo "patch-coverage base: ${BASE:-<none>}"
          set +e
          python3 tools/coverage_gate.py --report coverage.xml --diff-base "$BASE"
          rc=$?
          set -e
          if [ "$PATCH_COVERAGE_ENFORCE" = "true" ] && [ "$rc" -ne 0 ]; then
            echo "::error::patch coverage below the bar (set the PATCH_COVERAGE_ENFORCE repository variable to 'false' to report without blocking)"
            exit "$rc"
          fi

      # GitHub's equivalent of an ADO build artefact: attached to the run, listed
      # on the run page, downloadable with `gh run download <run-id>`.
      - name: Upload coverage report (artefact)
        uses: actions/upload-artifact@v7
        with:
          name: coverage-report
          path: |
            coverage.xml
          if-no-files-found: error
          retention-days: 30

      # Kept for the Codecov dashboard, but NOT counted on: it currently fails
      # with {"message":"Repository not found"} because the Codecov GitHub App is
      # not installed on this repository, and fail_ci_if_error: false hides that.
      # Installing the app (Settings -> Integrations, or a CODECOV_TOKEN) is what
      # makes this work; until then the gates above are the source of truth, so
      # this step must not be mistaken for one.
      - name: Upload to Codecov (best-effort, see comment)
        uses: codecov/codecov-action@v7
        continue-on-error: true
        with:
          files: coverage.xml
          use_oidc: true
          fail_ci_if_error: false

  # ---------------------------------------------------------------------------
  # Build + unit test — runs under both g++ and clang++ so ABI/syntax
  # differences are caught at PR time. Runs in parallel with the static
  # analysis jobs (public-repo compute is free; wall-clock feedback wins).
  # ---------------------------------------------------------------------------
  build-and-test:
    needs: [changes]
    if: needs.changes.outputs.cpp == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        cxx: [g++, clang++]
    env:
      CXX: ccache ${{ matrix.cxx }}
    steps:
      - uses: actions/checkout@v7
      - uses: ./.github/actions/install-deps
        with:
          extra: ccache

      - name: Cache ccache
        uses: actions/cache@v6
        with:
          path: ~/.ccache
          key: ccache-${{ matrix.cxx }}-${{ hashFiles('**/*.cpp', '**/*.h', 'Makefile.in', 'configure') }}
          restore-keys: ccache-${{ matrix.cxx }}-

      - name: Configure
        run: ./configure

      - name: Build
        run: make

      - name: Test
        run: make test

  # ---------------------------------------------------------------------------
  # macOS build-and-test — verifies the portable link lines (no --start-group)
  # and that the core compiles + tests pass on Apple's toolchain.
  # ---------------------------------------------------------------------------
  build-and-test-macos:
    needs: [changes]
    if: needs.changes.outputs.cpp == 'true'
    runs-on: macos-latest
    timeout-minutes: 90
    env:
      CXX: ccache clang++
    steps:
      - uses: actions/checkout@v7
      - uses: ./.github/actions/install-deps

      - name: Cache ccache
        uses: actions/cache@v6
        with:
          path: ~/Library/Caches/ccache
          key: ccache-macos-${{ hashFiles('**/*.cpp', '**/*.h', 'Makefile.in', 'configure') }}
          restore-keys: ccache-macos-

      - name: Configure
        # brew's ncurses is keg-only, so pkg-config cannot see its .pc files
        # without PKG_CONFIG_PATH pointing at the brew prefix. Without the wide
        # ncursesw the TUI's UTF-8 wide-char calls (mvaddnwstr/mvaddwstr) fail
        # to compile on macOS.
        run: |
          export PKG_CONFIG_PATH="$(brew --prefix ncurses)/lib/pkgconfig${PKG_CONFIG_PATH:+:$PKG_CONFIG_PATH}"
          ./configure

      - name: Build
        run: make

      - name: Test
        run: make test

  # ---------------------------------------------------------------------------
  # CD — build release artifacts on every push to main (not just tags), so the
  # latest main is always shippable. Artifacts are stored for 7 days.
  # ---------------------------------------------------------------------------
  cd:
    if: github.ref == 'refs/heads/main' || github.ref == 'refs/heads/master'
    needs: [changes, build-and-test]
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v7
      - uses: ./.github/actions/install-deps
        with:
          extra: ruby ruby-dev
      - name: Install fpm
        run: sudo gem install --no-document fpm

      - name: Configure
        run: ./configure --prefix=/usr

      - name: Build
        run: make

      - name: Stage install tree
        run: |
          rm -rf stage
          make install DESTDIR="$PWD/stage"

      - name: Build tarball + checksum
        run: |
          version="$(cat version.txt)-main"
          name="amber-${version}-linux-x86_64"
          mkdir -p dist
          tar -C stage -czf "dist/${name}.tar.gz" .
          ( cd dist && sha256sum "${name}.tar.gz" > "${name}.tar.gz.sha256" )

      - name: Build .deb (fpm)
        run: |
          version="$(cat version.txt)-main"
          fpm -s dir -t deb \
            -n amber \
            -v "${version}" \
            --license "Apache-2.0" \
            --maintainer "Jacek Trefon <hello@trefon.com>" \
            --url "https://github.com/jtrefon/amber" \
            --description "C++ AI agent harness with a headless CLI and ncurses TUI." \
            --depends "libcurl4" \
            --depends "libncursesw6" \
            --deb-no-default-config-files \
            -C stage \
            -p "dist/amber_${version}_amd64.deb" \
            usr
          ( cd dist && sha256sum "amber_${version}_amd64.deb" > "amber_${version}_amd64.deb.sha256" )

      - name: Upload tarball
        uses: actions/upload-artifact@v7
        with:
          name: amber-linux-tarball
          path: dist/*.tar.gz*
          retention-days: 7

      - name: Upload .deb
        uses: actions/upload-artifact@v7
        with:
          name: amber-linux-deb
          path: dist/*.deb*
          retention-days: 7

  # ---------------------------------------------------------------------------
  # CD (macOS) — build the macOS release artifact on every push to main so the
  # latest main is always shippable on Apple silicon. Produces a
  # self-contained tarball (binaries + data) for the Homebrew tap.
  # ---------------------------------------------------------------------------
  cd-macos:
    if: github.ref == 'refs/heads/main' || github.ref == 'refs/heads/master'
    needs: [changes, build-and-test-macos]
    runs-on: macos-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v7
      - uses: ./.github/actions/install-deps

      - name: Configure
        # brew's ncurses is keg-only; point pkg-config at it so the wide
        # ncursesw (required for the TUI's UTF-8 wide-char rendering) is found.
        run: |
          export PKG_CONFIG_PATH="$(brew --prefix ncurses)/lib/pkgconfig${PKG_CONFIG_PATH:+:$PKG_CONFIG_PATH}"
          ./configure --prefix=/usr/local

      - name: Build
        run: make

      - name: Stage install tree
        run: |
          rm -rf stage
          make install DESTDIR="$PWD/stage"

      - name: Build tarball + checksum
        run: |
          version="$(cat version.txt)-main"
          arch="$(uname -m)"
          name="amber-${version}-darwin-${arch}"
          mkdir -p dist
          tar -C stage -czf "dist/${name}.tar.gz" .
          ( cd dist && shasum -a 256 "${name}.tar.gz" > "${name}.tar.gz.sha256" )

      - name: Upload tarball
        uses: actions/upload-artifact@v7
        with:
          name: amber-macos-tarball
          path: dist/*.tar.gz*
          retention-days: 7

  # ---------------------------------------------------------------------------
  # Website build — validates the Astro site builds cleanly. Runs only when
  # website/ (or this workflow) changed.
  # ---------------------------------------------------------------------------
  website-build:
    needs: [changes]
    if: needs.changes.outputs.website == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: website/package-lock.json

      - name: Install dependencies
        run: cd website && npm ci

      - name: Audit dependencies
        # scripts/audit.mjs, not bare `npm audit`: it blocks every high/critical
        # advisory except those named in website/audit-exceptions.json, and each
        # exception carries a reason and an expiry that fails the build once it
        # lapses. See website/AGENTS.md.
        run: cd website && npm run audit

      - name: Build
        run: cd website && npm run build

      - name: Upload dist for smoke checks
        uses: actions/upload-artifact@v7
        with:
          name: website-dist
          path: website/dist
          retention-days: 1

      - name: Upload dist artifact (for deploy)
        if: github.ref == 'refs/heads/main' || github.ref == 'refs/heads/master'
        uses: actions/upload-pages-artifact@v5
        with:
          path: website/dist

  # ---------------------------------------------------------------------------
  # Website smoke checks — serve the deployed layout and verify representative
  # routes plus every same-site link emitted into the static HTML.
  # ---------------------------------------------------------------------------
  website-smoke:
    needs: [changes, website-build]
    if: needs.changes.outputs.website == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
      - uses: actions/download-artifact@v8
        with:
          name: website-dist
          path: /tmp/site-root/amber
      - name: Start static server
        run: |
          python3 -m http.server 4173 --directory /tmp/site-root >/tmp/website-server.log 2>&1 &
          echo $! > /tmp/website-server.pid
          for attempt in $(seq 1 20); do
            if curl --fail --silent http://127.0.0.1:4173/amber/ >/dev/null; then break; fi
            sleep 1
          done
          curl --fail --silent http://127.0.0.1:4173/amber/ >/dev/null
      - name: Check routes and internal links
        env:
          SMOKE_BASE_URL: http://127.0.0.1:4173/amber/
          SMOKE_DIST: /tmp/site-root/amber
        run: node website/scripts/smoke.mjs
      - name: Stop static server
        if: always()
        run: kill "$(cat /tmp/website-server.pid)"

  # ---------------------------------------------------------------------------
  # Website deploy — pushes the built site to GitHub Pages on main.
  # ---------------------------------------------------------------------------
  website-deploy:
    if: github.ref == 'refs/heads/main' || github.ref == 'refs/heads/master'
    needs: [website-build]
    runs-on: ubuntu-latest
    timeout-minutes: 30
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    permissions:
      pages: write
      id-token: write
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5

  # ---------------------------------------------------------------------------
  # Merge gate. Branch protection requires only this check: a job skipped by
  # the changes filter never reports a check run, so required matrix checks
  # (build-and-test (g++), lint, ...) would sit "Expected" forever on PRs that
  # touch no gated paths. This job always runs and fails unless the gating
  # jobs succeeded or legitimately skipped, so protection sees exactly one
  # always-reporting check. `changes` itself must succeed -- its failure also
  # skips the dependents, and that must never merge green.
  #
  # Every gating job is aggregated here, not just the fast ones: a red
  # sanitizer, coverage or macOS run must block a merge. `lint` is PR-only and
  # reports `skipped` on pushes (allowed). `lint-full` is intentionally
  # excluded -- it is a safety net, not a gate. `cd`/`cd-macos` and the
  # website deploy are delivery jobs; website smoke checks are gated.
  # ---------------------------------------------------------------------------
  ci-gate:
    needs: [changes, dependency-review, obfuscation-guard, build-and-test, build-and-test-macos, lint, analyze, check, complexity, duplicates, format-check, sanitizers, tsan, coverage, website-build, website-smoke]
    if: always()
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Verify gating jobs
        env:
          NEEDS: ${{ toJson(needs) }}
        run: |
          echo "$NEEDS" | jq -r 'to_entries | map("\(.key): \(.value.result)") | join("\n")'
          bad="$(echo "$NEEDS" | jq -r '
            to_entries
            | map(select(
                (.key == "changes" and .value.result != "success") or
                (.key != "changes" and
                  .value.result != "success" and .value.result != "skipped")))
            | map("\(.key): \(.value.result)") | join(", ")')"
          if [ -n "$bad" ]; then
            echo "::error::gating jobs did not pass: $bad"
            exit 1
          fi
          echo "All gating jobs succeeded or were skipped."
