name: Release

# Tag-based CD: pushing a semver tag (e.g. v0.1.0) builds release artifacts and
# publishes a GitHub Release. A tag containing a hyphen (e.g. v0.1.0-rc.1) is
# published as a pre-release. Building on a tag keeps releases deliberate and
# traceable rather than firing on every merge to main.

on:
  push:
    tags:
      - 'v[0-9]+.[0-9]+.[0-9]+'
      - 'v[0-9]+.[0-9]+.[0-9]+-*'
  # A release whose run failed before it published anything must be re-runnable
  # without moving the tag: a dispatch builds this workflow from the selected
  # branch (so a FIXED workflow is used) while checking out the tag for the
  # sources. v0.5.1 needed exactly this -- its tag run died on a stale
  # dependency name, and re-running the tag would re-run the old workflow file.
  workflow_dispatch:
    inputs:
      tag:
        description: 'Existing release tag to build and publish, e.g. v0.5.1'
        required: true
        type: string

permissions:
  contents: write

jobs:
  release:
    needs: [release-macos-arm64]
    runs-on: ubuntu-latest
    timeout-minutes: 60
    permissions:
      contents: write
      id-token: write
      attestations: write
    steps:
      - uses: actions/checkout@v7
        with:
          # A dispatch builds the TAG's sources with the selected branch's
          # workflow; a tag push checks out the tag it fired on.
          ref: ${{ inputs.tag || github.ref }}

      - name: Resolve version
        id: ver
        run: |
          tag="${{ inputs.tag || github.ref_name }}"
          echo "tag=${tag}" >> "$GITHUB_OUTPUT"
          echo "version=${tag#v}" >> "$GITHUB_OUTPUT"
          if [[ "${tag}" == *-* ]]; then
            echo "prerelease=true" >> "$GITHUB_OUTPUT"
          else
            echo "prerelease=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Install dependencies
        # Bounded like the CI install-deps action: a hung apt (dpkg lock or a
        # dead mirror) must fail the release, not sit until the job ceiling.
        # The 30 min install cap leaves a slow-but-progressing download room to
        # finish -- the cap is there to catch a hang, not to time a transfer.
        env:
          DEBIAN_FRONTEND: noninteractive
        run: |
          sudo timeout 300 apt-get -o DPkg::Lock::Timeout=120 \
            -o Acquire::Retries=3 update
          sudo timeout 1800 apt-get -o DPkg::Lock::Timeout=120 \
            -o Acquire::Retries=3 install -y \
            --no-install-recommends \
            build-essential libcurl4-openssl-dev libncursesw5-dev pkg-config

      - name: Sync VERSION to tag
        run: |
          # Keep the in-binary version (mural / kVersion) consistent with the
          # release tag. configure reads version.txt to stamp version.h.
          printf '%s\n' "${{ steps.ver.outputs.version }}" > version.txt

      - name: Configure
        run: ./configure --prefix=/usr

      - name: Build
        run: make

      - name: Test
        run: make test

      - name: Stage install tree
        run: |
          rm -rf stage
          make install DESTDIR="$PWD/stage"
          # Plugin executables belong in libexec; share/ is where a tree built
          # before the install split put them, and a re-run of such a tag has to
          # still be able to publish. Data is architecture-independent.
          test -n "$(find stage \( -path '*/libexec/amber/plugins/cdp/cdp-plugin' \
                                -o -path '*/share/amber/plugins/cdp/cdp-plugin' \) \
                       -type f -print -quit)"
          test -n "$(find stage -path '*/amber/plugins/cdp/manifest.json' -type f -print -quit)"
          test -n "$(find stage -path '*/amber/plugins/sysinfo/sysinfo-plugin' -type f -print -quit)"
          # The data files an installed run reads at startup, all of which were
          # missing from the tree before the install split. A tag older than
          # that split fails here by design: re-run it from its own branch, or
          # cut a new tag, rather than weakening what a release must contain.
          test -f stage/usr/share/amber/keybindings.json
          test -f stage/usr/share/amber/data/skill-collections.json
          test -f stage/usr/share/man/man1/amber.1
          test -f stage/usr/lib/pkgconfig/amber-agent.pc
          test -f stage/usr/include/amber-agent/agent/agent.h
          test -n "$(find stage -path '*/share/amber-bench/scenarios/*/*.json' -print -quit)"

      - name: Build tarball + checksum
        id: tar
        run: |
          version="${{ steps.ver.outputs.version }}"
          name="amber-${version}-linux-x86_64"
          mkdir -p dist
          tar -C stage -czf "dist/${name}.tar.gz" .
          ( cd dist && sha256sum "${name}.tar.gz" > "${name}.tar.gz.sha256" )
          echo "tarball=dist/${name}.tar.gz" >> "$GITHUB_OUTPUT"

      - name: Install smoke (installed tree, empty CWD)
        run: |
          # The .deb and .rpm are built by packages.yml from the same
          # `make install` tree, so what is verified here is what those
          # packages contain: install it for real, then run it from nowhere
          # with no project files and no user config.
          sudo make install
          # The runtime must carry the data the agent reads at startup, not
          # just the bootstrap files: keybindings, shelf tables, per-tool docs
          # and the coding library tree.
          test -f /usr/share/amber/keybindings.json
          test -f /usr/share/amber/completions.json
          test -f /usr/share/amber/data/skill-collections.json
          test -f /usr/share/amber/prompts/tools/read.md
          test -f /usr/share/amber/prompts/domains/coding/library/tags.md
          test -d /usr/share/amber/prompts/domains/coding/library/cpp-debugging
          # Plugin executables are architecture-dependent and live in libexec.
          test -x /usr/libexec/amber/plugins/cdp/cdp-plugin
          test -x /usr/libexec/amber/plugins/sysinfo/sysinfo-plugin

          rm -rf /tmp/smoke && mkdir -p /tmp/smoke/home
          cd /tmp/smoke
          set +e
          HOME=/tmp/smoke/home /usr/bin/amber-cli -p "hi" >/tmp/smoke/out.txt 2>&1
          rc=$?
          set -e
          if grep -q "critical data files missing" /tmp/smoke/out.txt; then
            echo "FAIL: packaged app could not find its data files"; cat /tmp/smoke/out.txt; exit 1
          fi
          echo "bootstrap OK (exit $rc — server connection expected to fail)"

          # The bench harness resolves its corpus from the install prefix, not
          # from the working directory it happens to be started in.
          /usr/bin/amber-bench list >/tmp/smoke/bench.txt
          test -s /tmp/smoke/bench.txt

          # The dev payload: headers, archives and the pkg-config file a
          # downstream build consumes.
          test -f /usr/include/amber-agent/agent/agent.h
          test -f /usr/include/amber-agent/nlohmann/json.hpp
          test -f /usr/lib/libagent_core.a
          test -f /usr/lib/pkgconfig/amber-agent.pc
          PKG_CONFIG_PATH=/usr/lib/pkgconfig pkg-config --cflags --libs amber-agent

      - name: Download macOS tarball (arm64)
        uses: actions/download-artifact@v8
        with:
          name: amber-macos-tarball-arm64
          path: dist

      - name: Attest release artifacts
        uses: actions/attest-build-provenance@v4
        with:
          subject-path: dist/*

      - name: Install Cosign
        uses: sigstore/cosign-installer@v3

      - name: Sign release artifacts
        run: |
          shopt -s nullglob
          for file in dist/*; do
            case "$file" in
              *.sha256|*.tar.gz|*.sig|*.pem) ;;
              *) continue ;;
            esac
            cosign sign-blob --yes \
              --output-signature "${file}.sig" \
              --output-certificate "${file}.pem" \
              "$file"
          done

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v3
        with:
          tag_name: ${{ steps.ver.outputs.tag }}
          name: ${{ steps.ver.outputs.tag }}
          generate_release_notes: true
          prerelease: ${{ steps.ver.outputs.prerelease }}
          # Linux packages are not release assets: they are published to the
          # signed apt and rpm repositories by packages.yml, which is the only
          # place their signatures and indexes are produced.
          files: |
            dist/*.tar.gz
            dist/*.sig
            dist/*.pem
            dist/*.sha256

  # ---------------------------------------------------------------------------
  # macOS release — builds the darwin tarball in parallel with the Linux job.
  # Apple Silicon only (macos-latest); Intel macOS builds were retired — the
  # legacy macos-13 runners were over-subscribed and Intel Macs are no longer
  # a supported target. The Homebrew tap (jtrefon/homebrew-amber) picks the
  # arm64 checksum up when it exists.
  # ---------------------------------------------------------------------------
  release-macos-arm64:
    runs-on: macos-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ inputs.tag || github.ref }}

      - name: Resolve version
        id: ver
        run: |
          tag="${{ inputs.tag || github.ref_name }}"
          echo "version=${tag#v}" >> "$GITHUB_OUTPUT"

      - name: Install dependencies
        run: brew install curl ncurses pkg-config

      - name: Sync VERSION to tag
        run: printf '%s\n' "${{ steps.ver.outputs.version }}" > version.txt

      - name: Configure
        # brew's ncurses is keg-only; point pkg-config at it so the wide
        # ncursesw (required for the TUI's UTF-8 wide-char rendering) is found.
        run: |
          ncurses_prefix="$(brew --prefix ncurses)"
          export PKG_CONFIG_PATH="$ncurses_prefix/lib/pkgconfig${PKG_CONFIG_PATH:+:$PKG_CONFIG_PATH}"
          ./configure --prefix=/usr/local

      - name: Build
        run: make

      - name: Test
        run: make test

      - name: Stage install tree
        run: |
          rm -rf stage
          make install DESTDIR="$PWD/stage"
          # Plugin executables are architecture-dependent and land in libexec on
          # every platform; share/ is the pre-split location, kept so an older
          # tag can still be re-run. The data tree stays architecture-independent.
          test -n "$(find stage \( -path '*/libexec/amber/plugins/cdp/cdp-plugin' \
                                -o -path '*/share/amber/plugins/cdp/cdp-plugin' \) \
                       -type f -print -quit)"
          test -n "$(find stage -path '*/amber/plugins/cdp/manifest.json' -type f -print -quit)"
          test -n "$(find stage -path '*/amber/plugins/sysinfo/sysinfo-plugin' -type f -print -quit)"
          test -f stage/usr/local/share/amber/keybindings.json
          test -f stage/usr/local/share/man/man1/amber.1
          test -n "$(find stage -path '*/share/amber-bench/scenarios/*/*.json' -print -quit)"

      - name: Build tarball + checksum
        run: |
          version="${{ steps.ver.outputs.version }}"
          arch="$(uname -m)"
          name="amber-${version}-darwin-${arch}"
          mkdir -p dist
          tar -C stage -czf "dist/${name}.tar.gz" .
          ( cd dist && shasum -a 256 "${name}.tar.gz" > "${name}.tar.gz.sha256" )

      - name: Upload macOS tarball
        uses: actions/upload-artifact@v7
        with:
          name: amber-macos-tarball-arm64
          path: dist/*.tar.gz*
          retention-days: 7
