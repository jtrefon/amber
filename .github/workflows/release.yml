name: Release

# Tag-based CD: pushing a semver tag (e.g. v0.1.0) builds release artifacts and
# publishes a GitHub Release. A tag containing a hyphen (e.g. v0.1.0-rc.1) is
# published as a pre-release. Building on a tag keeps releases deliberate and
# traceable rather than firing on every merge to main.

on:
  push:
    tags:
      - 'v[0-9]+.[0-9]+.[0-9]+'
      - 'v[0-9]+.[0-9]+.[0-9]+-*'
  # A release whose run failed before it published anything must be re-runnable
  # without moving the tag: a dispatch builds this workflow from the selected
  # branch (so a FIXED workflow is used) while checking out the tag for the
  # sources. v0.5.1 needed exactly this -- its tag run died on a stale
  # dependency name, and re-running the tag would re-run the old workflow file.
  workflow_dispatch:
    inputs:
      tag:
        description: 'Existing release tag to build and publish, e.g. v0.5.1'
        required: true
        type: string

permissions:
  contents: write

jobs:
  release:
    needs: [release-macos-arm64]
    runs-on: ubuntu-latest
    timeout-minutes: 60
    permissions:
      contents: write
      id-token: write
      attestations: write
    steps:
      - uses: actions/checkout@v7
        with:
          # A dispatch builds the TAG's sources with the selected branch's
          # workflow; a tag push checks out the tag it fired on.
          ref: ${{ inputs.tag || github.ref }}

      - name: Resolve version
        id: ver
        run: |
          tag="${{ inputs.tag || github.ref_name }}"
          echo "tag=${tag}" >> "$GITHUB_OUTPUT"
          echo "version=${tag#v}" >> "$GITHUB_OUTPUT"
          if [[ "${tag}" == *-* ]]; then
            echo "prerelease=true" >> "$GITHUB_OUTPUT"
          else
            echo "prerelease=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Install dependencies
        # Bounded like the CI install-deps action: a hung apt (dpkg lock or a
        # dead mirror) must fail the release, not sit until the job ceiling.
        env:
          DEBIAN_FRONTEND: noninteractive
        run: |
          sudo timeout 300 apt-get -o DPkg::Lock::Timeout=120 update
          sudo timeout 600 apt-get -o DPkg::Lock::Timeout=120 install -y \
            --no-install-recommends \
            build-essential libcurl4-openssl-dev libncursesw5-dev \
            pkg-config ruby ruby-dev rpm
          sudo gem install --no-document fpm

      - name: Sync VERSION to tag
        run: |
          # Keep the in-binary version (mural / kVersion) consistent with the
          # release tag. configure reads version.txt to stamp version.h.
          printf '%s\n' "${{ steps.ver.outputs.version }}" > version.txt

      - name: Configure
        run: ./configure --prefix=/usr

      - name: Build
        run: make

      - name: Test
        run: make test

      - name: Stage install tree
        run: |
          rm -rf stage
          make install DESTDIR="$PWD/stage"

      - name: Build tarball + checksum
        id: tar
        run: |
          version="${{ steps.ver.outputs.version }}"
          name="amber-${version}-linux-x86_64"
          mkdir -p dist
          tar -C stage -czf "dist/${name}.tar.gz" .
          ( cd dist && sha256sum "${name}.tar.gz" > "${name}.tar.gz.sha256" )
          echo "tarball=dist/${name}.tar.gz" >> "$GITHUB_OUTPUT"

      - name: Build .deb (fpm)
        id: deb
        run: |
          version="${{ steps.ver.outputs.version }}"
          # Ubuntu packages the wide form/menu/panel runtime libs INSIDE
          # libncursesw6 (libformw.so.6, libmenuw.so.6, libpanelw.so.6). The
          # separate names this used to declare do not exist, so `dpkg -i`
          # refused the package with unresolved dependencies and the bootstrap
          # smoke never reached the binary.
          fpm -s dir -t deb \
            -n amber \
            -v "${version}" \
            --license "Apache-2.0" \
            --maintainer "Jacek Trefon <hello@trefon.com>" \
            --url "https://github.com/jtrefon/amber" \
            --description "C++ AI agent harness with a headless CLI and ncurses TUI." \
            --depends "libcurl4" \
            --depends "libncursesw6" \
            --deb-no-default-config-files \
            -C stage \
            -p "dist/amber_${version}_amd64.deb" \
            usr
          ( cd dist && sha256sum "amber_${version}_amd64.deb" > "amber_${version}_amd64.deb.sha256" )

      - name: Build .rpm (fpm)
        id: rpm
        run: |
          version="${{ steps.ver.outputs.version }}"
          # Fedora ships the same wide runtimes (ncursesw, formw, menuw,
          # panelw) inside ncurses-libs, and its curl runtime is libcurl --
          # the Debian names were wrong on the RPM side too.
          fpm -s dir -t rpm \
            -n amber \
            -v "${version}" \
            --license "Apache-2.0" \
            --maintainer "Jacek Trefon <hello@trefon.com>" \
            --url "https://github.com/jtrefon/amber" \
            --description "C++ AI agent harness with a headless CLI and ncurses TUI." \
            --depends "libcurl" \
            --depends "ncurses-libs" \
            -C stage \
            -p "dist/amber_${version}.x86_64.rpm" \
            usr
          ( cd dist && sha256sum "amber_${version}.x86_64.rpm" > "amber_${version}.x86_64.rpm.sha256" )

      - name: Build CDP plugin packages (deb + rpm)
        id: cdp-pkg
        run: |
          version="${{ steps.ver.outputs.version }}"
          rm -rf stage-cdp
          mkdir -p stage-cdp/usr/share/amber/plugins/cdp
          install -m 755 tools/plugins/cdp/cdp-plugin stage-cdp/usr/share/amber/plugins/cdp/
          install -m 644 tools/plugins/cdp/manifest.json stage-cdp/usr/share/amber/plugins/cdp/
          fpm -s dir -t deb \
            -n amber-plugin-cdp \
            -v "${version}" \
            --license "Apache-2.0" \
            --maintainer "Jacek Trefon <hello@trefon.com>" \
            --url "https://github.com/jtrefon/amber" \
            --description "CDP browser plugin for amber (Chrome DevTools Protocol)." \
            --depends "amber" \
            --deb-no-default-config-files \
            -C stage-cdp \
            -p "dist/amber-plugin-cdp_${version}_amd64.deb" \
            usr
          fpm -s dir -t rpm \
            -n amber-plugin-cdp \
            -v "${version}" \
            --license "Apache-2.0" \
            --maintainer "Jacek Trefon <hello@trefon.com>" \
            --url "https://github.com/jtrefon/amber" \
            --description "CDP browser plugin for amber (Chrome DevTools Protocol)." \
            --depends "amber" \
            -C stage-cdp \
            -p "dist/amber-plugin-cdp_${version}.x86_64.rpm" \
            usr
          ( cd dist && sha256sum amber-plugin-cdp_${version}_amd64.deb amber-plugin-cdp_${version}.x86_64.rpm > amber-plugin-cdp_${version}.sha256 )

      - name: Bootstrap smoke (installed package, empty CWD)
        run: |
          # The installed app must find prompts and completions.json from the
          # system data dir — no project files, no user config.
          sudo dpkg -i dist/amber_${{ steps.ver.outputs.version }}_amd64.deb
          rm -rf /tmp/smoke && mkdir -p /tmp/smoke
          cd /tmp/smoke
          set +e
          HOME=/tmp/smoke/home /usr/bin/amber-cli -p "hi" >/tmp/smoke/out.txt 2>&1
          rc=$?
          set -e
          if grep -q "critical data files missing" /tmp/smoke/out.txt; then
            echo "FAIL: packaged app could not find its data files"; cat /tmp/smoke/out.txt; exit 1
          fi
          echo "bootstrap OK (exit $rc — server connection expected to fail)"
          sudo dpkg -r amber >/dev/null

      - name: Download macOS tarball (arm64)
        uses: actions/download-artifact@v8
        with:
          name: amber-macos-tarball-arm64
          path: dist

      - name: Attest release artifacts
        uses: actions/attest-build-provenance@v4
        with:
          subject-path: dist/*

      - name: Install Cosign
        uses: sigstore/cosign-installer@v3

      - name: Sign release artifacts
        run: |
          shopt -s nullglob
          for file in dist/*; do
            case "$file" in
              *.sha256|*.tar.gz|*.deb|*.rpm|*.sig|*.pem) ;;
              *) continue ;;
            esac
            cosign sign-blob --yes \
              --output-signature "${file}.sig" \
              --output-certificate "${file}.pem" \
              "$file"
          done

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v3
        with:
          tag_name: ${{ steps.ver.outputs.tag }}
          name: ${{ steps.ver.outputs.tag }}
          generate_release_notes: true
          prerelease: ${{ steps.ver.outputs.prerelease }}
          files: |
            dist/*.tar.gz
            dist/*.tar.gz.sha256
            dist/*.deb
            dist/*.deb.sha256
            dist/*.rpm
            dist/*.rpm.sha256
            dist/amber-plugin-cdp*
            dist/*.sig
            dist/*.pem

  # ---------------------------------------------------------------------------
  # macOS release — builds the darwin tarball in parallel with the Linux job.
  # Apple Silicon only (macos-latest); Intel macOS builds were retired — the
  # legacy macos-13 runners were over-subscribed and Intel Macs are no longer
  # a supported target. The Homebrew tap (jtrefon/homebrew-amber) picks the
  # arm64 checksum up when it exists.
  # ---------------------------------------------------------------------------
  release-macos-arm64:
    runs-on: macos-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ inputs.tag || github.ref }}

      - name: Resolve version
        id: ver
        run: |
          tag="${{ inputs.tag || github.ref_name }}"
          echo "version=${tag#v}" >> "$GITHUB_OUTPUT"

      - name: Install dependencies
        run: brew install curl ncurses pkg-config

      - name: Sync VERSION to tag
        run: printf '%s\n' "${{ steps.ver.outputs.version }}" > version.txt

      - name: Configure
        # brew's ncurses is keg-only; point pkg-config at it so the wide
        # ncursesw (required for the TUI's UTF-8 wide-char rendering) is found.
        run: |
          export PKG_CONFIG_PATH="$(brew --prefix ncurses)/lib/pkgconfig${PKG_CONFIG_PATH:+:$PKG_CONFIG_PATH}"
          ./configure --prefix=/usr/local

      - name: Build
        run: make

      - name: Test
        run: make test

      - name: Stage install tree
        run: |
          rm -rf stage
          make install DESTDIR="$PWD/stage"

      - name: Build tarball + checksum
        run: |
          version="${{ steps.ver.outputs.version }}"
          arch="$(uname -m)"
          name="amber-${version}-darwin-${arch}"
          mkdir -p dist
          tar -C stage -czf "dist/${name}.tar.gz" .
          ( cd dist && shasum -a 256 "${name}.tar.gz" > "${name}.tar.gz.sha256" )

      - name: Upload macOS tarball
        uses: actions/upload-artifact@v7
        with:
          name: amber-macos-tarball-arm64
          path: dist/*.tar.gz*
          retention-days: 7
