name: Install build dependencies
description: >
  Install the C++ build dependencies (apt on Linux, Homebrew on macOS).
  Extra packages can be requested via the `extra` input (space-separated
  apt package names on Linux; ignored on macOS where brew handles all).
  Set `cpp_toolchain` to 'false' for jobs that only need ./configure's
  probes to run (the pure-Python gates): that drops the toolchain down to
  what configure cannot proceed without.
  On Linux the install retries a dead mirror, falls back to a documented
  mirror, and can run from the restored package cache; see install-deps.sh.

inputs:
  extra:
    description: Extra apt packages to install (Linux only)
    required: false
    default: ''
  cpp_toolchain:
    description: >
      Install the full C++ toolchain (clang, ncurses, pkg-config) on top of
      the configure prerequisites. 'false' keeps only what ./configure fails
      hard without: build-essential (g++/gcc) and libcurl4-openssl-dev.
    required: false
    default: 'true'

runs:
  using: composite
  steps:
    # The cache key is the package request, not the job: two jobs asking for
    # the same set share one cache entry, and a different `extra` gets its own.
    # The week in the key refreshes the lists weekly, so a restored cache is
    # never more than a week stale; restore-keys still finds last week's entry
    # if the first run of a week meets an outage.
    - name: Resolve apt cache key (Linux)
      if: runner.os == 'Linux'
      id: apt-cache-key
      shell: bash
      env:
        CPP_TOOLCHAIN: ${{ inputs.cpp_toolchain }}
        EXTRA_PACKAGES: ${{ inputs.extra }}
        ACTION_HASH: ${{ hashFiles('.github/actions/install-deps/action.yml') }}
      run: |
        week="$(date -u +%G-%V)"
        digest="$(printf '%s|%s' "$CPP_TOOLCHAIN" "$EXTRA_PACKAGES" | cksum | cut -d' ' -f1)"
        # The image is literal on purpose: upgrading the pin must invalidate the
        # cache instead of silently reusing debs built for another release.
        echo "key=apt-ubuntu-24.04-${RUNNER_ARCH}-${ACTION_HASH}-${week}-${digest}" >> "$GITHUB_OUTPUT"

    - name: Restore apt package cache (Linux)
      if: runner.os == 'Linux'
      id: apt-cache
      uses: actions/cache/restore@0057852bfaa89a56745cba8c7296529d2fc39830 # v4
      with:
        path: ${{ runner.temp }}/amber-apt
        key: ${{ steps.apt-cache-key.outputs.key }}
        restore-keys: |
          apt-${{ runner.os }}-${{ runner.arch }}-

    - name: Install dependencies (Linux)
      if: runner.os == 'Linux'
      shell: bash
      # The script owns the bounded attempts, the fallback mirror and the
      # offline path. The old inline version swallowed the mirror update with
      # `|| true`, so a DNS outage surfaced as a bare exit 124 from the install
      # timeout with no statement of what had failed. It also means this logic
      # is testable without a runner: tests/gates/test_install_deps.py drives
      # it with a fake apt that reproduces the outage.
      env:
        DEBIAN_FRONTEND: noninteractive
        AMBER_APT_CACHE_DIR: ${{ runner.temp }}/amber-apt
        AMBER_APT_ATTEMPTS: '3'
        AMBER_APT_BACKOFF_SECONDS: '10'
      run: >-
        bash .github/actions/install-deps/install-deps.sh
        --cpp-toolchain "${{ inputs.cpp_toolchain }}"
        --extra "${{ inputs.extra }}"

    - name: Save apt package cache (Linux)
      if: runner.os == 'Linux' && steps.apt-cache.outputs.cache-hit != 'true'
      # A cache save race with another job is a warning, never a job failure:
      # the cache is an optimization, not a gate.
      continue-on-error: true
      uses: actions/cache/save@0057852bfaa89a56745cba8c7296529d2fc39830 # v4
      with:
        path: ${{ runner.temp }}/amber-apt
        key: ${{ steps.apt-cache-key.outputs.key }}

    - name: Install dependencies (macOS)
      if: runner.os == 'macOS'
      shell: bash
      run: brew install curl ncurses pkg-config ccache
